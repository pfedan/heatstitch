<!doctype html>
<!-- What a pull request's preview address shows once the pull request is closed (.github/workflows/deploy.yml). -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>heatstitch: Vorschau beendet</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f2f7; color: #1d1a22; font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { box-sizing: border-box; width: min(420px, calc(100vw - 32px)); padding: 24px; }
      p { margin: 0 0 12px; color: #6b6475; }
      a { color: #b5317a; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #141118; color: #ece8f1; } p { color: #a49cb0; } a { color: #e0559e; } }
    </style>
  </head>
  <body>
    <main>
      <p>Diese Vorschau gehört zu einem abgeschlossenen Pull Request. heatstitch selbst: <a href="https://heatstitch.app/de/">heatstitch.app</a></p>
      <p lang="en">This preview belongs to a closed pull request. heatstitch itself: <a href="https://heatstitch.app/">heatstitch.app</a></p>
    </main>
  </body>
</html>
