<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 0,20" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="260" fill="#ffffff"/>

  <!-- 1 -->
  <g transform="translate(20,40)">
    <text x="0" y="-14" font-weight="bold" fill="#0f172a">1  In the hoop</text>
    <rect x="0" y="0" width="210" height="190" fill="url(#g)" stroke="#334155" stroke-width="3"/>
    <path d="M20,70 L110,70 M20,90 L110,90 M20,110 L110,110" stroke="#b45309" stroke-width="3"/>
    <circle cx="175" cy="45" r="6" fill="#0f172a"/>
    <text x="186" y="44" fill="#0f172a">X</text>
    <circle cx="140" cy="75" r="6" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <line x1="170" y1="49" x2="146" y2="70" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#b)"/>
    <text x="150" y="100" fill="#1d4ed8">u(X)</text>
    <text x="10" y="150" fill="#334155">Earlier stitches moved X by</text>
    <text x="10" y="168" fill="#334155">u(X). To hit X, the needle</text>
    <text x="10" y="186" fill="#334155">must go to X + u(X).</text>
  </g>

  <!-- 2 -->
  <g transform="translate(260,40)">
    <text x="0" y="-14" font-weight="bold" fill="#0f172a">2  Every stitch pulls</text>
    <rect x="0" y="0" width="210" height="190" fill="url(#g)" stroke="#334155" stroke-width="3"/>
    <line x1="50" y1="80" x2="160" y2="80" stroke="#b45309" stroke-width="4"/>
    <circle cx="50" cy="80" r="5" fill="#0f172a"/>
    <circle cx="160" cy="80" r="5" fill="#0f172a"/>
    <line x1="30" y1="80" x2="46" y2="80" stroke="#c2410c" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="180" y1="80" x2="164" y2="80" stroke="#c2410c" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="10" y="132" fill="#334155">Thread 2 % shorter than when</text>
    <text x="10" y="150" fill="#334155">sewn: pull T ≈ 0.4 N, then</text>
    <text x="10" y="168" fill="#334155">it stiffens the fabric.</text>
  </g>

  <!-- 3 -->
  <g transform="translate(500,40)">
    <text x="0" y="-14" font-weight="bold" fill="#0f172a">3  Unhooping</text>
    <rect x="0" y="0" width="210" height="190" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="8" y="8" width="194" height="174" fill="url(#g)" stroke="#334155" stroke-width="2"/>
    <path d="M60,60 L150,60 L150,120 L60,120 z" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M66,64 L144,64 L144,116 L66,116 z" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
    <text x="10" y="150" fill="#334155">Free edge, no pre-stretch:</text>
    <text x="10" y="168" fill="#334155">the design shrinks.</text>
  </g>

  <!-- 4 -->
  <g transform="translate(740,40)">
    <text x="0" y="-14" font-weight="bold" fill="#0f172a">4  Correction</text>
    <rect x="0" y="0" width="200" height="190" fill="url(#g)" stroke="#334155" stroke-width="3"/>
    <circle cx="100" cy="62" r="6" fill="#0f172a"/>
    <text x="80" y="50" fill="#0f172a">Target</text>
    <circle cx="60" cy="92" r="6" fill="none" stroke="#c2410c" stroke-width="2.5"/>
    <text x="14" y="114" fill="#c2410c">Result</text>
    <line x1="66" y1="88" x2="94" y2="66" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="140" cy="32" r="6" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <line x1="106" y1="58" x2="134" y2="37" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#b)"/>
    <text x="118" y="64" fill="#1d4ed8">New needle</text>
    <text x="10" y="140" fill="#334155">Move the needle against</text>
    <text x="10" y="158" fill="#334155">the deviation, simulate</text>
    <text x="10" y="176" fill="#334155">again, repeat.</text>
  </g>
</svg>
