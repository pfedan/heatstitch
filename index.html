<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>heatstitch: view, edit and check DST and PES embroidery files in your browser</title>
    <meta name="description" content="Free embroidery editor in your browser: open DST, PES or SVG, edit sewing order, fill patterns and single stitches, check stitch density and save as DST or PES." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pfedan.github.io/heatstitch/" />
    <meta name="application-name" content="heatstitch" />
    <meta name="apple-mobile-web-app-title" content="heatstitch" />
    <meta name="theme-color" content="#1b1026" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="heatstitch" />
    <meta property="og:url" content="https://pfedan.github.io/heatstitch/" />
    <meta property="og:title" content="heatstitch: view, edit and check embroidery files" />
    <meta property="og:description" content="Sewing sequence, objects, fill patterns and single stitches, plus a density check that fixes what is too dense. Turns pictures and SVG into stitches. Free, and your files never leave your device." />
    <meta property="og:image" content="https://pfedan.github.io/heatstitch/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An embroidered cat in heatstitch, shown three ways: realistic threads, sewing order and density heatmap" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="heatstitch: view, edit and check embroidery files" />
    <meta name="twitter:description" content="Sewing sequence, objects, fill patterns and single stitches, plus a density check that fixes what is too dense. Turns pictures and SVG into stitches. Free, and your files never leave your device." />
    <meta name="twitter:image" content="https://pfedan.github.io/heatstitch/og-image.jpg" />
    <meta name="twitter:image:alt" content="An embroidered cat in heatstitch, shown three ways: realistic threads, sewing order and density heatmap" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "heatstitch",
        "url": "https://pfedan.github.io/heatstitch/",
        "image": "https://pfedan.github.io/heatstitch/og-image.jpg",
        "description": "Free browser-based editor for DST and PES machine embroidery files: sewing sequence, objects, fill patterns, single stitches, stitch density check and correction, and pictures to stitches.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript. WebGL2 for the realistic thread view.",
        "inLanguage": ["en", "de"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "softwareHelp": { "@type": "CreativeWork", "url": "https://pfedan.github.io/heatstitch/docs.html" },
        "featureList": [
          "Opens Tajima DST and Brother PES embroidery files, SVG drawings and .heatstitch projects",
          "Sewing sequence player with color layers, stitch type and order coloring",
          "Objects per color: reorder by drag or optimize the order, combine and split",
          "Sew objects anew: fill patterns (tatami, gradient, contour, spiral), spacing, angle, underlay, satin width",
          "Move, insert and delete single stitches",
          "Trim or carry jumps, with tie-off and tie-in stitches",
          "Thread length and needle penetration density heatmaps",
          "Checks density, short-stitch clusters and perforation for fabric and thread weight",
          "Automatic and manual stitch correction with undo and side by side comparison",
          "Saves corrected designs as DST or PES",
          "Turns images, photos and SVG files into embroidery files: color reduction to thread colors, brush touch-up, fill, satin and running stitch",
          "Saves the whole workspace as a .heatstitch project",
          "Realistic thread preview",
          "Installable, works offline",
          "Files never leave your device"
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      <p class="noscript">heatstitch needs JavaScript. <a href="docs.html">Read the guide</a> to see what it does.</p>
    </noscript>
    <header class="topbar">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="28" height="28" />
        <h1>heatstitch</h1>
      </div>
      <div class="modes segmented" role="radiogroup" id="modes" data-i18n-aria="mode.label">
        <label data-i18n-title="mode.flow.hint"><input type="radio" name="mode" value="flow" /><span><span data-i18n="mode.flow"></span><kbd>1</kbd></span></label>
        <label data-i18n-title="mode.density.hint"><input type="radio" name="mode" value="density" /><span><span data-i18n="mode.density"></span><kbd>2</kbd></span></label>
        <label data-i18n-title="mode.image.hint"><input type="radio" name="mode" value="image" /><span><span data-i18n="mode.image"></span><kbd>3</kbd></span></label>
      </div>
      <nav class="topbar-end">
        <a class="doc-link" id="doc-link" href="docs.html" data-i18n="app.docs">Guide</a>
        <select id="lang" aria-label="Language">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </nav>
    </header>

    <main class="layout" id="layout">
      <aside class="sidebar">
        <section class="panel" data-mode="flow density">
          <h2 data-i18n="files.title"></h2>
          <label class="dropzone" id="dropzone">
            <input type="file" id="file-input" accept=".dst,.pes,.svg,.DST,.PES,.SVG,.heatstitch" multiple hidden />
            <span data-i18n="files.drop"></span>
          </label>
          <p class="privacy-note" data-i18n-title="files.privacy.detail">
            <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="2.5" y="7" width="11" height="8" rx="1.5" fill="currentColor"/></svg>
            <span data-i18n="files.privacy"></span>
          </p>
          <select id="load-example" class="example-select" data-i18n-aria="files.example">
            <option value="" data-i18n="files.example" selected hidden></option>
            <optgroup data-i18n-label="files.example.stitches">
              <option value="examples/cat-60mm.pes" data-i18n="files.example.cat"></option>
              <option value="examples/demos/overlap.pes" data-i18n="files.example.overlap"></option>
              <option value="examples/demos/confetti.pes" data-i18n="files.example.confetti"></option>
            </optgroup>
            <optgroup data-i18n-label="files.example.svg">
              <option value="examples/svg/overlapping-circles.svg" data-i18n="files.example.overlapSvg"></option>
              <option value="examples/svg/shapes-benchmark.svg" data-i18n="files.example.benchmark"></option>
            </optgroup>
          </select>
          <ul id="file-list" class="file-list"></ul>
          <div class="file-actions" id="file-actions" hidden>
            <span class="label save-label" data-i18n-title="save.note"><span data-i18n="save.title"></span> <span class="info" aria-hidden="true">ⓘ</span></span>
            <div class="buttons">
              <button type="button" id="save-dst" data-i18n="save.dst"></button>
              <button type="button" id="save-pes" data-i18n="save.pes"></button>
            </div>
            <button type="button" id="save-project" class="save-project" data-i18n="save.project" data-i18n-title="save.project.hint"></button>
            <button type="button" id="revert" class="link" data-i18n="edit.revert" hidden></button>
          </div>
        </section>

        <!-- Bild: the image and how it is prepared -->
        <section class="panel" data-mode="image">
          <h2 data-i18n="image.title"></h2>
          <label class="dropzone" id="image-drop">
            <input type="file" id="image-input" accept="image/*,.svg" hidden />
            <span data-i18n="image.drop"></span>
          </label>
          <p class="privacy-note" data-i18n-title="files.privacy.detail">
            <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="2.5" y="7" width="11" height="8" rx="1.5" fill="currentColor"/></svg>
            <span data-i18n="files.privacy"></span>
          </p>
          <button type="button" id="image-example" class="link" data-i18n="image.example"></button>
          <p class="muted small" id="image-info"></p>
          <div class="image-actions">
            <button type="button" id="image-save-project" class="link" data-i18n="image.saveProject" data-i18n-title="save.project.hint" hidden></button>
            <button type="button" id="image-clear" class="link" data-i18n="image.clear" data-i18n-title="image.clear.hint" hidden></button>
          </div>
          <details class="ai-prep" data-section="aiPrep">
            <summary data-i18n="image.ai.title"></summary>
            <p class="small" data-i18n="image.ai.intro"></p>
            <ol class="small">
              <li data-i18n="image.ai.step1"></li>
              <li data-i18n="image.ai.step2"></li>
              <li data-i18n="image.ai.step3"></li>
            </ol>
            <textarea id="image-ai-prompt" class="ai-prompt" rows="9" readonly data-i18n-aria="image.ai.prompt"></textarea>
            <div class="buttons">
              <button type="button" id="image-ai-copy" data-i18n="image.ai.copy"></button>
            </div>
            <p class="muted small" data-i18n="image.ai.note"></p>
          </details>
        </section>

        <section class="panel" data-mode="image">
          <h2 data-i18n="image.prep"></h2>
          <label class="field">
            <span class="label"><span data-i18n="image.width"></span> <output id="image-height"></output></span>
            <input type="number" id="image-width" min="10" max="400" step="1" />
          </label>
          <p class="muted small" id="image-svg-note" data-i18n="image.svg.note" hidden></p>
          <label class="field" id="image-colors-field" data-i18n-title="image.colors.hint">
            <span class="label"><span data-i18n="image.colors"></span> <output id="image-colors-out"></output></span>
            <input type="range" id="image-colors" min="2" max="16" step="1" />
          </label>
          <label class="field" id="image-smooth-field" data-i18n-title="image.smooth.hint">
            <span class="label"><span data-i18n="image.smooth"></span> <output id="image-smooth-out"></output></span>
            <input type="range" id="image-smooth" min="0" max="5" step="1" />
          </label>
          <label class="field" data-i18n-title="image.minArea.hint">
            <span class="label"><span data-i18n="image.minArea"></span> <output id="image-min-area-out"></output></span>
            <input type="range" id="image-min-area" min="0.5" max="20" step="0.5" />
          </label>
          <label class="check" data-i18n-title="image.background.hint"><input type="checkbox" id="image-background" /><span data-i18n="image.background"></span></label>
          <label class="check" data-i18n-title="image.threads.hint"><input type="checkbox" id="image-threads" /><span data-i18n="image.threads"></span></label>
        </section>

        <section class="panel" data-mode="image">
          <h2 data-i18n="image.stitch"></h2>
          <p class="muted small" id="image-material"></p>
          <div class="field-row">
            <label class="field" data-i18n-title="image.spacing.hint">
              <span class="label" data-i18n="image.spacing"></span>
              <input type="number" id="image-spacing" min="0.2" max="1.5" step="0.05" />
            </label>
            <label class="field" data-i18n-title="image.pull.hint">
              <span class="label" data-i18n="image.pull"></span>
              <input type="number" id="image-pull" min="0" max="1" step="0.05" />
            </label>
          </div>
          <label class="field" data-i18n-title="image.angle.hint">
            <span class="label" data-i18n="image.angle"></span>
            <select id="image-angle"></select>
          </label>
          <label class="field" data-i18n-title="image.satinMax.hint">
            <span class="label"><span data-i18n="image.satinMax"></span> <output id="image-satin-max-out"></output></span>
            <input type="range" id="image-satin-max" min="1" max="10" step="0.5" />
          </label>
          <label class="field" data-i18n-title="image.tolerance.hint">
            <span class="label"><span data-i18n="stitch.tolerance"></span> <output id="image-tolerance-out"></output></span>
            <input type="range" id="image-tolerance" min="0.05" max="0.5" step="0.05" />
          </label>
          <label class="check" data-i18n-title="image.underlay.hint"><input type="checkbox" id="image-underlay" /><span data-i18n="image.underlay"></span></label>
          <button type="button" id="image-stitch-reset" class="link" data-i18n="image.stitch.reset" hidden></button>
        </section>

        <!-- Ablauf: what the colors mean -->
        <section class="panel" data-mode="flow">
          <h2 data-i18n="flow.settings"></h2>
          <div class="field">
            <span class="label" data-i18n="colorBy.title"></span>
            <div class="segmented wrap" role="radiogroup">
              <label><input type="radio" name="color-by" value="thread" /><span data-i18n="colorBy.thread"></span></label>
              <label><input type="radio" name="color-by" value="order" /><span data-i18n="colorBy.order"></span></label>
              <label><input type="radio" name="color-by" value="kind" /><span data-i18n="colorBy.kind"></span></label>
              <label><input type="radio" name="color-by" value="length" /><span data-i18n="colorBy.length"></span></label>
            </div>
          </div>
          <div id="color-key" class="color-key"></div>
        </section>

        <!-- Dichte: material, checks and heatmap -->
        <section class="panel" id="material-panel" data-mode="density image">
          <h2 data-i18n="profile.title"></h2>
          <div class="profile">
            <label class="field">
              <span class="label" data-i18n="profile.fabric"></span>
              <select id="fabric"></select>
            </label>
            <label class="field">
              <span class="label" data-i18n="profile.thread"></span>
              <select id="thread"></select>
            </label>
            <p class="profile-info" id="profile-info"></p>
          </div>
          <fieldset class="checks" data-mode="density">
            <legend data-i18n="checks.title"></legend>
            <div id="checks"></div>
          </fieldset>
          <details class="explain" data-mode="density">
            <summary data-i18n="validation.explain"></summary>
            <ul id="explain"></ul>
          </details>
        </section>

        <section class="panel" data-mode="density">
          <h2 data-i18n="heatmap.title"></h2>
          <div class="field">
            <span class="label" data-i18n="controls.metric"></span>
            <div class="segmented" role="radiogroup">
              <label><input type="radio" name="metric" value="thread" /><span data-i18n="metric.thread"></span></label>
              <label><input type="radio" name="metric" value="penetrations" /><span data-i18n="metric.penetrations"></span></label>
            </div>
            <span class="unit-hint" id="unit-hint"></span>
          </div>
          <details class="section" data-section="advanced">
            <summary data-i18n="heatmap.advanced"></summary>
            <label class="field">
              <span class="label"><span data-i18n="controls.cell"></span> <output id="cell-out"></output></span>
              <input type="range" id="cell" min="0.5" max="5" step="0.25" />
            </label>
            <label class="field">
              <span class="label"><span data-i18n="controls.blur"></span> <output id="blur-out"></output></span>
              <input type="range" id="blur" min="0" max="3" step="0.1" />
            </label>
            <label class="field">
              <span class="label" data-i18n="controls.max"></span>
              <input type="number" id="max" min="0.1" step="0.5" />
            </label>
            <label class="check"><input type="checkbox" id="include-jumps" /><span data-i18n="controls.jumps"></span></label>
          </details>
        </section>

        <!-- Both modes: what is drawn and how -->
        <details class="panel section" data-section="display">
          <summary><h2 data-i18n="display.title"></h2></summary>
          <div data-mode="density">
            <label class="check"><input type="checkbox" id="overlay" /><span data-i18n="controls.overlay"></span></label>
            <label class="field indent">
              <span class="label"><span data-i18n="controls.opacity"></span> <output id="opacity-out"></output></span>
              <input type="range" id="opacity" min="0.05" max="1" step="0.05" />
            </label>
          </div>
          <label class="check" data-i18n-title="controls.realistic.hint"><input type="checkbox" id="realistic" /><span data-i18n="controls.realistic"></span></label>
          <label class="field indent" data-i18n-title="controls.threadWidth.hint">
            <span class="label"><span data-i18n="controls.threadWidth"></span> <output id="thread-width-out"></output></span>
            <input type="range" id="thread-width" min="0.02" max="1" step="0.01" />
          </label>
          <label class="check indent" data-i18n-title="controls.liveLight.hint"><input type="checkbox" id="live-light" /><span data-i18n="controls.liveLight"></span></label>
          <button type="button" id="allow-tilt" class="link indent" data-i18n="controls.tilt" hidden></button>
          <div class="field bg-field" data-i18n-title="controls.background.hint">
            <span class="label"><span data-i18n="controls.background"></span> <output id="bg-out"></output></span>
            <div class="bg-swatches" id="bg-swatches"></div>
          </div>
          <fieldset class="marks" data-mode="flow density">
            <legend data-i18n="marks.title"></legend>
            <label class="check"><input type="checkbox" data-mark="jumps" /><span><i class="mk mk-jump" aria-hidden="true"></i><span data-i18n="marks.jumps"></span></span></label>
            <label class="check" data-mode="flow" data-i18n-title="marks.threads.hint"><input type="checkbox" data-mark="threads" /><span><i class="mk mk-thread" aria-hidden="true"></i><span data-i18n="marks.threads"></span></span></label>
            <label class="check"><input type="checkbox" data-mark="trims" /><span><i class="mk" aria-hidden="true">✂</i><span data-i18n="marks.trims"></span></span></label>
            <label class="check"><input type="checkbox" data-mark="colors" /><span><i class="mk mk-num" aria-hidden="true">1</i><span data-i18n="marks.colors"></span></span></label>
            <label class="check"><input type="checkbox" data-mark="ends" /><span><i class="mk mk-start" aria-hidden="true">S</i><span data-i18n="marks.ends"></span></span></label>
            <label class="check" data-i18n-title="marks.points.hint"><input type="checkbox" data-mark="points" /><span><i class="mk mk-point" aria-hidden="true"></i><span data-i18n="marks.points"></span></span></label>
          </fieldset>
        </details>

        <details class="panel section" data-section="stats" data-mode="flow density">
          <summary><h2 data-i18n="stats.title"></h2></summary>
          <dl id="stats" class="stats"></dl>
          <label class="field speed">
            <span class="label" data-i18n="stats.speed"></span>
            <select id="machine-spm">
              <option value="400">400</option>
              <option value="600">600</option>
              <option value="800">800</option>
              <option value="1000">1000</option>
              <option value="1200">1200</option>
            </select>
          </label>
        </details>
      </aside>

      <div class="resizer" data-panel="side" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="layout.resizeSide" data-i18n-title="layout.resize.hint"></div>
      <div class="resizer" data-panel="inspector" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="layout.resizeInspector" data-i18n-title="layout.resize.hint"></div>

      <section class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="stage-tools stage-tools-start" data-mode="flow density">
          <button type="button" id="undo" class="tool" data-i18n-title="edit.undo.key" data-i18n-aria="edit.undo"><span aria-hidden="true">↶</span></button>
          <button type="button" id="redo" class="tool" data-i18n-title="edit.redo.key" data-i18n-aria="edit.redo"><span aria-hidden="true">↷</span></button>
          <button type="button" id="lettering-new" class="tool" data-mode="flow" data-i18n-title="lettering.tool.hint"><span class="tool-glyph" aria-hidden="true">T</span> <span data-i18n="lettering.tool"></span></button>
          <div class="segmented level-switch" role="radiogroup" data-i18n-aria="level.label">
            <label data-i18n-title="level.objects.hint"><input type="radio" name="level" value="objects" checked /><span data-i18n="level.objects"></span></label>
            <label data-i18n-title="level.shape.hint" data-mode="flow"><input type="radio" name="level" value="shape" /><span data-i18n="level.shape"></span></label>
            <label data-i18n-title="level.stitches.hint"><input type="radio" name="level" value="stitches" /><span data-i18n="level.stitches"></span></label>
          </div>
          <span class="edit-crumb" id="edit-crumb" hidden></span>
        </div>
        <div class="stage-tools stage-tools-end">
          <button type="button" id="image-shine" class="tool primary" data-mode="image" data-i18n-title="image.shine.hint" hidden><span aria-hidden="true">✦</span> <span data-i18n="image.shine"></span></button>
          <button type="button" id="fit" class="tool" data-i18n-title="controls.fit.key"><span aria-hidden="true">⤢</span> <span data-i18n="controls.fit"></span></button>
          <button type="button" id="export" class="tool" data-mode="flow density" data-i18n-title="controls.export.hint"><span aria-hidden="true">⤓</span> PNG</button>
        </div>
        <div class="stage-tools stage-tools-center segmented" role="radiogroup" data-mode="image" data-i18n-aria="image.view">
          <label><input type="radio" name="image-view" value="original" /><span data-i18n="image.view.original"></span></label>
          <label><input type="radio" name="image-view" value="prepared" /><span data-i18n="image.view.prepared"></span></label>
          <label><input type="radio" name="image-view" value="stitches" /><span data-i18n="image.view.stitches"></span></label>
        </div>
        <p class="image-status" id="image-status" data-mode="image" aria-live="polite"></p>
        <canvas id="legend" class="legend" width="260" height="46" data-mode="density"></canvas>
        <div id="tooltip" class="tooltip" hidden></div>
        <p class="empty" id="empty" data-i18n="canvas.empty"></p>
        <p class="hint" id="canvas-hint"></p>
        <button type="button" id="findings-open" class="findings-chip" data-mode="density" hidden></button>
        <div class="player" id="player" data-mode="flow" hidden>
          <div class="player-buttons">
            <button type="button" class="tool" data-play="block-prev" data-i18n-title="player.blockPrev"><span aria-hidden="true">⏮</span></button>
            <button type="button" class="tool" data-play="prev" data-i18n-title="player.prev"><span aria-hidden="true">◂</span></button>
            <button type="button" class="tool play" data-play="toggle" data-i18n-title="player.play"><span aria-hidden="true">▶</span></button>
            <button type="button" class="tool" data-play="next" data-i18n-title="player.next"><span aria-hidden="true">▸</span></button>
            <button type="button" class="tool" data-play="block-next" data-i18n-title="player.blockNext"><span aria-hidden="true">⏭</span></button>
          </div>
          <div class="player-track">
            <div class="player-sections" id="player-sections" aria-hidden="true"></div>
            <input type="range" id="player-pos" min="0" max="1" step="1" value="1" data-i18n-aria="player.pos" />
          </div>
          <span class="player-info" id="player-info"></span>
          <select id="player-speed" data-i18n-title="player.speed" data-i18n-aria="player.speed">
            <option value="1">1×</option>
            <option value="10">10×</option>
            <option value="50">50×</option>
            <option value="250">250×</option>
          </select>
        </div>
      </section>

      <aside class="inspector" id="inspector">
        <!-- Bild -->
        <section class="panel" data-mode="image">
          <h2 data-i18n="image.palette"></h2>
          <ul class="image-palette" id="image-palette"></ul>
          <p class="muted small" data-i18n="image.palette.hint"></p>
        </section>

        <section class="panel" data-mode="image">
          <h2 data-i18n="image.brush"></h2>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="image-tool" value="none" checked /><span data-i18n="image.tool.none"></span></label>
            <label><input type="radio" name="image-tool" value="paint" /><span data-i18n="image.tool.paint"></span></label>
            <label><input type="radio" name="image-tool" value="erase" /><span data-i18n="image.tool.erase"></span></label>
          </div>
          <label class="field">
            <span class="label"><span data-i18n="image.brushSize"></span> <output id="image-brush-out"></output></span>
            <input type="range" id="image-brush" min="0.5" max="20" step="0.5" />
          </label>
          <p class="muted small" id="image-brush-hint"></p>
          <div class="buttons">
            <button type="button" id="image-strokes-undo" data-i18n="image.undo"></button>
            <button type="button" id="image-strokes-clear" data-i18n="image.strokes.clear"></button>
          </div>
        </section>

        <section class="panel" data-mode="image">
          <h2 data-i18n="image.result"></h2>
          <dl id="image-result" class="stats"></dl>
          <div id="image-verdict"></div>
          <div class="buttons">
            <button type="button" id="image-take" class="primary" data-i18n="image.take"></button>
          </div>
          <p class="muted small" data-i18n="image.take.hint"></p>
        </section>

        <!-- Ablauf -->
        <section class="panel layers" id="layers-panel" data-mode="flow">
          <div class="panel-head">
            <h2 data-i18n="layers.title"></h2>
            <button type="button" class="link" id="layers-reset" data-i18n="layers.showAll" hidden></button>
          </div>
          <div class="order-bar">
            <button type="button" id="order-optimize" aria-expanded="false" aria-controls="order-card" data-i18n-title="order.button.hint"><span aria-hidden="true">⇅</span> <span data-i18n="order.button"></span></button>
          </div>
          <div class="order-card" id="order-card" role="group" data-i18n-aria="order.button" hidden></div>
          <ul class="layer-list" id="layer-list"></ul>
          <p class="layer-note" id="layer-note" role="status" hidden></p>
        </section>

        <section class="panel object-panel" id="object-panel" data-mode="flow" hidden>
          <div class="panel-head">
            <h2 data-i18n="object.title"></h2>
            <button type="button" id="object-close" class="icon" data-i18n-title="object.clear"><span aria-hidden="true">&#x2715;</span></button>
          </div>
          <div id="object-body"></div>
          <div id="object-stitches" class="object-stitches"></div>
          <p class="layer-note error" id="object-msg" role="status" hidden></p>
        </section>

        <section class="panel lettering-panel" id="lettering-panel" data-mode="flow" hidden>
          <div class="panel-head">
            <h2 data-i18n="lettering.title"></h2>
            <button type="button" id="lettering-close" class="icon" data-i18n-title="lettering.close"><span aria-hidden="true">&#x2715;</span></button>
          </div>
          <div id="lettering-body"></div>
        </section>

        <section class="panel jumps" id="jumps-panel" data-mode="flow">
          <h2 data-i18n="jumps.title"></h2>
          <div id="jumps" class="jumps-body" aria-live="polite"></div>
        </section>

        <!-- Dichte -->
        <section class="panel findings" id="findings-panel" data-mode="density">
          <div class="findings-head">
            <h2 data-i18n="findings.title"></h2>
            <label class="check val-toggle" data-i18n-title="validation.overlay.key"><input type="checkbox" id="show-validation" /><span data-i18n="validation.overlay"></span></label>
            <button type="button" id="findings-close" class="icon" data-i18n-title="findings.hide"><span aria-hidden="true">&#x2715;</span></button>
          </div>
          <div id="validation" class="findings-body" aria-live="polite"></div>
        </section>

        <section class="panel" id="correct-panel" data-mode="density">
          <h2><span data-i18n="correct.title"></span> <span class="beta-badge" data-i18n="correct.beta" data-i18n-title="correct.beta.hint"></span></h2>
          <div class="field">
            <span class="label" data-i18n="correct.goal"></span>
            <div class="segmented" role="radiogroup">
              <label><input type="radio" name="fix-goal" value="caution" /><span data-i18n="correct.goal.caution"></span></label>
              <label><input type="radio" name="fix-goal" value="critical" /><span data-i18n="correct.goal.critical"></span></label>
            </div>
          </div>
          <div class="field">
            <span class="label" data-i18n="correct.focus"></span>
            <div class="segmented" role="radiogroup">
              <label><input type="radio" name="fix-focus" value="both" /><span data-i18n="correct.focus.both"></span></label>
              <label><input type="radio" name="fix-focus" value="thread" /><span data-i18n="correct.focus.thread"></span></label>
              <label><input type="radio" name="fix-focus" value="holes" /><span data-i18n="correct.focus.holes"></span></label>
            </div>
            <p class="muted small" id="fix-focus-hint"></p>
          </div>
          <div class="buttons">
            <button type="button" id="fix-all" class="primary" data-i18n="correct.all"></button>
            <button type="button" id="fix-zone" data-i18n="correct.zone"></button>
          </div>
          <div id="fix-report" class="fix-report" aria-live="polite"></div>

          <h3 data-i18n="edit.title"></h3>
          <p class="muted small" id="edit-off-hint" data-i18n="edit.panelHint"></p>
          <div id="edit-tools" class="edit-tools" hidden>
            <p class="muted small" data-i18n="edit.hint"></p>
            <p class="sel-info" id="sel-info"></p>
            <div class="buttons">
              <button type="button" id="sel-delete" data-i18n="edit.delete"></button>
              <button type="button" id="sel-thin" data-i18n="edit.thin"></button>
              <select id="thin-share" aria-label="">
                <option value="0.25">25 %</option>
                <option value="0.34" selected>33 %</option>
                <option value="0.5">50 %</option>
              </select>
            </div>
          </div>

          <h3 data-i18n="compare.title"></h3>
          <div class="buttons">
            <button type="button" id="compare-toggle" aria-pressed="false" data-i18n="compare.start"></button>
          </div>
          <table class="compare-table" id="compare-table" hidden></table>
        </section>
      </aside>
    </main>
    <div class="update-notice" id="update-notice" role="status" hidden>
      <span data-i18n="update.text"></span>
      <button type="button" class="primary" data-update="reload" data-i18n="update.reload"></button>
      <button type="button" class="icon" data-update="dismiss" data-i18n-title="update.dismiss">×</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
