          "Opens Tajima DST and Brother PES embroidery files, SVG drawings and .heatstitch projects",
          "Sewing sequence player with color layers, stitch type and order coloring",
          "Objects per color: reorder by drag or optimize the order, combine and split",
          "Sew objects anew: fill patterns (tatami, gradient, contour, spiral), spacing, angle, underlay, satin width",
          "Move, insert and delete single stitches",
          "Trim or carry jumps, with tie-off and tie-in stitches",
          "Thread length and needle penetration density heatmaps",
          "Checks density, short-stitch clusters and perforation for fabric and thread weight",
          "Automatic and manual stitch correction with undo and side by side comparison",

      <section class="stage" id="stage">

          <div class="stage-bar">
            <div class="stage-tools stage-tools-start" data-mode="flow density">

              <span class="edit-crumb" id="edit-crumb" hidden></span>

              <label><input type="radio" name="image-view" value="original" /><span data-i18n="image.view.original"></span></label>
              <label><input type="radio" name="image-view" value="prepared" /><span data-i18n="image.view.prepared"></span></label>
              <label><input type="radio" name="image-view" value="stitches" /><span data-i18n="image.view.stitches"></span></label>
            </div>
            <div class="stage-tools stage-tools-end">
              <button type="button" id="image-shine" class="tool primary" data-mode="image" data-i18n-title="image.shine.hint" hidden><span aria-hidden="true">✦</span> <span data-i18n="image.shine"></span></button>
              <button type="button" id="marks-toggle" class="tool" data-mode="flow density" aria-pressed="true" data-i18n-title="marks.toggle.key" data-i18n-aria="marks.toggle"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 15 L16 5" stroke-dasharray="2.6 2.2" /><circle cx="4" cy="15" r="2.4" class="node" /><circle cx="16" cy="5" r="2.4" class="node" /><path d="M3 3 L17 17" class="slash" /></svg></button>
              <button type="button" id="fit" class="tool" data-i18n-title="controls.fit.key"><span aria-hidden="true">⤢</span> <span data-i18n="controls.fit"></span></button>
              <button type="button" id="export" class="tool" data-mode="flow density" data-i18n-title="controls.export.hint"><span aria-hidden="true">⤓</span> PNG</button>
            </div>
          </div>
        </div>
        <p class="image-status" id="image-status" data-mode="image" aria-live="polite"></p>
        <canvas id="legend" class="legend" width="260" height="46" data-mode="density"></canvas>
        <div id="tooltip" class="tooltip" hidden></div>
        <p class="empty" id="empty" data-i18n="canvas.empty"></p>
        <p class="hint" id="canvas-hint"></p>
        <div class="player" id="player" data-mode="flow" hidden>
          <div class="player-buttons">
            <button type="button" class="tool" data-play="block-prev" data-i18n-title="player.blockPrev"><span aria-hidden="true">⏮</span></button>
            <button type="button" class="tool" data-play="prev" data-i18n-title="player.prev"><span aria-hidden="true">◂</span></button>
            <button type="button" class="tool play" data-play="toggle" data-i18n-title="player.play"><span aria-hidden="true">▶</span></button>
            <button type="button" class="tool" data-play="next" data-i18n-title="player.next"><span aria-hidden="true">▸</span></button>
            <button type="button" class="tool" data-play="block-next" data-i18n-title="player.blockNext"><span aria-hidden="true">⏭</span></button>
          </div>
          <div class="player-track">
            <div class="player-sections" id="player-sections" aria-hidden="true"></div>
            <input type="range" id="player-pos" min="0" max="1" step="1" value="1" data-i18n-aria="player.pos" />
          </div>
          <span class="player-info" id="player-info"></span>
          <select id="player-speed" data-i18n-title="player.speed" data-i18n-aria="player.speed">
            <option value="1">1×</option>
            <option value="10">10×</option>
            <option value="50">50×</option>
            <option value="250">250×</option>
          </select>
        </div>
      </section>

      <aside class="inspector" id="inspector">
        <div class="insp-tabs segmented" role="tablist" data-mode="flow" id="insp-tabs">
          <button type="button" role="tab" data-tab="object" aria-selected="false"><span data-i18n="shell.tab.object"></span></button>
          <button type="button" role="tab" data-tab="design" aria-selected="true"><span data-i18n="shell.tab.design"></span></button>
        </div>
        <!-- Bild -->
        <section class="panel" data-mode="image">
          <h2 data-i18n="image.palette"></h2>
          <ul class="image-palette" id="image-palette"></ul>
          <p class="muted small" data-i18n="image.palette.hint"></p>
        </section>

        <section class="panel" data-mode="image">
          <h2 data-i18n="image.brush"></h2>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="image-tool" value="none" checked /><span data-i18n="image.tool.none"></span></label>
            <label><input type="radio" name="image-tool" value="paint" /><span data-i18n="image.tool.paint"></span></label>
            <label><input type="radio" name="image-tool" value="erase" /><span data-i18n="image.tool.erase"></span></label>
          </div>
          <label class="field">
            <span class="label"><span data-i18n="image.brushSize"></span> <output id="image-brush-out"></output></span>
            <input type="range" id="image-brush" min="0.5" max="20" step="0.5" />
          </label>
          <p class="muted small" id="image-brush-hint"></p>
          <div class="buttons">
            <button type="button" id="image-strokes-undo" data-i18n="image.undo"></button>
            <button type="button" id="image-strokes-clear" data-i18n="image.strokes.clear"></button>
          </div>
        </section>

        <section class="panel" data-mode="image">
          <h2 data-i18n="image.result"></h2>
          <dl id="image-result" class="stats"></dl>
          <div id="image-verdict"></div>
          <div class="buttons">
            <button type="button" id="image-take" class="primary" data-i18n="image.take"></button>
          </div>
          <p class="muted small" data-i18n="image.take.hint"></p>
        </section>

        <div class="insp-page" data-page="object" data-mode="flow">
          <p class="insp-empty muted" id="object-empty" data-i18n="shell.object.empty"></p>
          <section class="panel object-panel" id="object-panel" data-mode="flow" hidden>
            <div class="panel-head">
              <h2 data-i18n="object.title"></h2>
              <button type="button" id="object-close" class="icon" data-i18n-title="object.clear"><span aria-hidden="true">&#x2715;</span></button>
            </div>
            <div id="object-body"></div>
            <div id="object-stitches" class="object-stitches"></div>
            <p class="layer-note error" id="object-msg" role="status" hidden></p>
          </section>

          <section class="panel lettering-panel" id="lettering-panel" data-mode="flow" hidden>
            <div class="panel-head">
              <h2 data-i18n="lettering.title"></h2>
              <button type="button" id="lettering-close" class="icon" data-i18n-title="lettering.close"><span aria-hidden="true">&#x2715;</span></button>
            </div>
            <div id="lettering-body"></div>
          </section>
        </div>

        <div class="insp-page" data-page="design" data-mode="flow density">
          <section class="panel" id="hoop-panel" data-mode="flow">
            <h2 data-i18n="hoop.title"></h2>
            <label class="field hoop-field">
              <span class="label" data-i18n="hoop.title" data-i18n-title="hoop.hint"></span>
              <select id="hoop"></select>
            </label>
            <div class="hoop-custom" id="hoop-custom" hidden>
              <input type="number" id="hoop-w" min="10" max="1000" step="1" data-i18n-aria="hoop.width" />
              <span>×</span>
              <input type="number" id="hoop-h" min="10" max="1000" step="1" data-i18n-aria="hoop.height" />
              <span>mm</span>
            </div>
            <p class="hoop-note" id="hoop-note" hidden></p>
          </section>
          <!-- Ablauf: what the colors mean -->
          <section class="panel" data-mode="flow">
            <h2 data-i18n="flow.settings"></h2>
            <div class="field">
              <span class="label" data-i18n="colorBy.title"></span>
              <div class="segmented wrap" role="radiogroup">
                <label><input type="radio" name="color-by" value="thread" /><span data-i18n="colorBy.thread"></span></label>
                <label><input type="radio" name="color-by" value="order" /><span data-i18n="colorBy.order"></span></label>
                <label><input type="radio" name="color-by" value="kind" /><span data-i18n="colorBy.kind"></span></label>
                <label><input type="radio" name="color-by" value="length" /><span data-i18n="colorBy.length"></span></label>
              </div>
            </div>
            <div id="color-key" class="color-key"></div>
          </section>
          <section class="panel jumps" id="jumps-panel" data-mode="flow">
            <h2 data-i18n="jumps.title"></h2>
            <div id="jumps" class="jumps-body" aria-live="polite"></div>
          </section>
          <!-- Dichte -->
          <details class="panel section findings" id="findings-panel" data-mode="density" data-section="findings">
            <summary><h2 data-i18n="findings.title"></h2><span id="findings-sum" class="findings-sum"></span></summary>
            <label class="check val-toggle" data-i18n-title="validation.overlay.key"><input type="checkbox" id="show-validation" /><span data-i18n="validation.overlay"></span></label>
            <div id="validation" class="findings-body" aria-live="polite"></div>
          </details>

          <section class="panel" id="correct-panel" data-mode="density">
            <h2><span data-i18n="correct.title"></span> <span class="beta-badge" data-i18n="correct.beta" data-i18n-title="correct.beta.hint"></span></h2>
            <div class="field">
              <span class="label" data-i18n="correct.goal"></span>
              <div class="segmented" role="radiogroup">
                <label><input type="radio" name="fix-goal" value="caution" /><span data-i18n="correct.goal.caution"></span></label>
                <label><input type="radio" name="fix-goal" value="critical" /><span data-i18n="correct.goal.critical"></span></label>
              </div>
            </div>
            <div class="field">
              <span class="label" data-i18n="correct.focus"></span>
              <div class="segmented" role="radiogroup">
                <label><input type="radio" name="fix-focus" value="both" /><span data-i18n="correct.focus.both"></span></label>
                <label><input type="radio" name="fix-focus" value="thread" /><span data-i18n="correct.focus.thread"></span></label>
                <label><input type="radio" name="fix-focus" value="holes" /><span data-i18n="correct.focus.holes"></span></label>
              </div>
              <p class="muted small" id="fix-focus-hint"></p>
            </div>
            <div class="buttons">
              <button type="button" id="fix-all" class="primary" data-i18n="correct.all"></button>
              <button type="button" id="fix-zone" data-i18n="correct.zone"></button>
            </div>
            <div id="fix-report" class="fix-report" aria-live="polite"></div>

            <h3 data-i18n="edit.title"></h3>
            <p class="muted small" id="edit-off-hint" data-i18n="edit.panelHint"></p>
            <div id="edit-tools" class="edit-tools" hidden>
              <p class="muted small" data-i18n="edit.hint"></p>
              <p class="sel-info" id="sel-info"></p>
              <div class="buttons">
                <button type="button" id="sel-delete" data-i18n="edit.delete"></button>
                <button type="button" id="sel-thin" data-i18n="edit.thin"></button>
                <select id="thin-share" aria-label="">
                  <option value="0.25">25 %</option>
                  <option value="0.34" selected>33 %</option>
                  <option value="0.5">50 %</option>
                </select>
              </div>
            </div>

            <h3 data-i18n="compare.title"></h3>
            <div class="buttons">
              <button type="button" id="compare-toggle" aria-pressed="false" data-i18n="compare.start"></button>
            </div>
            <table class="compare-table" id="compare-table" hidden></table>
          </section>
          <!-- Dichte: material, checks and heatmap -->
          <section class="panel" id="material-panel" data-mode="density image">
            <h2 data-i18n="profile.title"></h2>
            <div class="profile">
              <label class="field">
                <span class="label" data-i18n="profile.fabric"></span>
                <select id="fabric"></select>
              </label>
              <label class="field">
                <span class="label" data-i18n="profile.thread"></span>
                <select id="thread"></select>
              </label>
              <p class="profile-info" id="profile-info"></p>
              <div class="buttons" data-mode="density">
                <button type="button" id="fabric-tune" data-i18n="tune.button" data-i18n-title="tune.button.hint"></button>
              </div>
            </div>
            <fieldset class="checks" data-mode="density">
              <legend data-i18n="checks.title"></legend>
              <div id="checks"></div>
            </fieldset>
            <details class="explain" data-mode="density">
              <summary data-i18n="validation.explain"></summary>
              <ul id="explain"></ul>
            </details>
          </section>
          <section class="panel" data-mode="density">
            <h2 data-i18n="heatmap.title"></h2>
            <div class="field">
              <span class="label" data-i18n="controls.metric"></span>
              <div class="segmented" role="radiogroup">
                <label><input type="radio" name="metric" value="thread" /><span data-i18n="metric.thread"></span></label>
                <label><input type="radio" name="metric" value="penetrations" /><span data-i18n="metric.penetrations"></span></label>
              </div>
              <span class="unit-hint" id="unit-hint"></span>
            </div>
            <details class="section" data-section="advanced">
              <summary data-i18n="heatmap.advanced"></summary>
              <label class="field">
                <span class="label"><span data-i18n="controls.cell"></span> <output id="cell-out"></output></span>
                <input type="range" id="cell" min="0.5" max="5" step="0.25" />
              </label>
              <label class="field">
                <span class="label"><span data-i18n="controls.blur"></span> <output id="blur-out"></output></span>
                <input type="range" id="blur" min="0" max="3" step="0.1" />
              </label>
              <label class="field">
                <span class="label" data-i18n="controls.max"></span>
                <input type="number" id="max" min="0.1" step="0.5" />
              </label>
              <label class="check"><input type="checkbox" id="include-jumps" /><span data-i18n="controls.jumps"></span></label>
            </details>
          </section>
          <!-- Both modes: what is drawn and how -->
          <details class="panel section" data-section="display">
            <summary><h2 data-i18n="display.title"></h2></summary>
            <div data-mode="density">
              <label class="check"><input type="checkbox" id="overlay" /><span data-i18n="controls.overlay"></span></label>
              <label class="field indent">
                <span class="label"><span data-i18n="controls.opacity"></span> <output id="opacity-out"></output></span>
                <input type="range" id="opacity" min="0.05" max="1" step="0.05" />
              </label>
            </div>
            <label class="check" data-mode="flow" data-i18n-title="display.shapes.hint"><input type="checkbox" id="shapes-view" /><span data-i18n="display.shapes"></span></label>
            <label class="check" data-i18n-title="controls.realistic.hint"><input type="checkbox" id="realistic" /><span data-i18n="controls.realistic"></span></label>
            <label class="field indent" data-i18n-title="controls.threadWidth.hint">
              <span class="label"><span data-i18n="controls.threadWidth"></span> <output id="thread-width-out"></output></span>
              <input type="range" id="thread-width" min="0.02" max="1" step="0.01" />
            </label>
            <label class="check indent" data-i18n-title="controls.liveLight.hint"><input type="checkbox" id="live-light" /><span data-i18n="controls.liveLight"></span></label>
            <button type="button" id="allow-tilt" class="link indent" data-i18n="controls.tilt" hidden></button>
            <div class="field bg-field" data-i18n-title="controls.background.hint">
              <span class="label"><span data-i18n="controls.background"></span> <output id="bg-out"></output></span>
              <div class="bg-swatches" id="bg-swatches"></div>
            </div>
            <label class="field" data-i18n-title="controls.fabric.hint">
              <span class="label" data-i18n="controls.fabric"></span>
              <select id="fabric-look"></select>
            </label>
            <fieldset class="marks" data-mode="flow density">
              <legend data-i18n="marks.title"></legend>
              <label class="check"><input type="checkbox" data-mark="jumps" /><span><i class="mk mk-jump" aria-hidden="true"></i><span data-i18n="marks.jumps"></span></span></label>
              <label class="check" data-mode="flow" data-i18n-title="marks.threads.hint"><input type="checkbox" data-mark="threads" /><span><i class="mk mk-thread" aria-hidden="true"></i><span data-i18n="marks.threads"></span></span></label>
              <label class="check"><input type="checkbox" data-mark="trims" /><span><i class="mk" aria-hidden="true">✂</i><span data-i18n="marks.trims"></span></span></label>
              <label class="check"><input type="checkbox" data-mark="colors" /><span><i class="mk mk-num" aria-hidden="true">1</i><span data-i18n="marks.colors"></span></span></label>
              <label class="check"><input type="checkbox" data-mark="ends" /><span><i class="mk mk-start" aria-hidden="true">S</i><span data-i18n="marks.ends"></span></span></label>
              <label class="check" data-i18n-title="marks.points.hint"><input type="checkbox" data-mark="points" /><span><i class="mk mk-point" aria-hidden="true"></i><span data-i18n="marks.points"></span></span></label>
            </fieldset>
          </details>
          <details class="panel section" data-section="stats" data-mode="flow density">
            <summary><h2 data-i18n="stats.title"></h2></summary>
            <dl id="stats" class="stats"></dl>
            <label class="field speed">
              <span class="label" data-i18n="stats.speed"></span>
              <select id="machine-spm">
                <option value="400">400</option>
                <option value="600">600</option>
                <option value="800">800</option>
                <option value="1000">1000</option>
                <option value="1200">1200</option>
              </select>
            </label>
          </details>
        </div>
      </aside>
    </main>
    <div class="update-notice" id="update-notice" role="status" hidden>
      <span data-i18n="update.text"></span>
      <button type="button" class="primary" data-update="reload" data-i18n="update.reload"></button>
      <button type="button" class="icon" data-update="dismiss" data-i18n-title="update.dismiss">×</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
