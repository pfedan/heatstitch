<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>heatstitch: stitch density heatmap, check and fix for DST and PES embroidery files</title>
    <meta name="description" content="Free web app for machine embroidery: open DST or PES files, see thread density as a heatmap, find areas that are too dense for your fabric and thread, fix them automatically or by hand, and save as DST or PES." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pfedan.github.io/heatstitch/" />
    <meta name="application-name" content="heatstitch" />
    <meta name="apple-mobile-web-app-title" content="heatstitch" />
    <meta name="theme-color" content="#1b1026" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="heatstitch" />
    <meta property="og:url" content="https://pfedan.github.io/heatstitch/" />
    <meta property="og:title" content="heatstitch: check and fix stitch density in embroidery files" />
    <meta property="og:description" content="Open DST or PES files, see thread density as a heatmap, find spots that are too dense for your fabric, fix them and save again." />
    <meta property="og:image" content="https://pfedan.github.io/heatstitch/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="heatstitch showing an embroidered cat as a stitch density heatmap next to its thread view" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="heatstitch: check and fix stitch density in embroidery files" />
    <meta name="twitter:description" content="Open DST or PES files, see thread density as a heatmap, find spots that are too dense for your fabric, fix them and save again." />
    <meta name="twitter:image" content="https://pfedan.github.io/heatstitch/og-image.png" />
    <meta name="twitter:image:alt" content="heatstitch showing an embroidered cat as a stitch density heatmap next to its thread view" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "heatstitch",
        "url": "https://pfedan.github.io/heatstitch/",
        "image": "https://pfedan.github.io/heatstitch/og-image.png",
        "description": "Stitch density heatmap, validation and correction for DST and PES machine embroidery files.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript. WebGL2 for the realistic thread view.",
        "inLanguage": ["en", "de"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "softwareHelp": { "@type": "CreativeWork", "url": "https://pfedan.github.io/heatstitch/docs.html" },
        "featureList": [
          "Opens Tajima DST and Brother PES embroidery files",
          "Thread length and needle penetration density heatmaps",
          "Checks density, short-stitch clusters and perforation for fabric and thread weight",
          "Automatic and manual stitch correction with undo and side by side comparison",
          "Saves corrected designs as DST or PES",
          "Realistic thread preview",
          "Installable, works offline"
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      <p class="noscript">heatstitch needs JavaScript. <a href="docs.html">Read the guide</a> to see what it does.</p>
    </noscript>
    <header class="topbar">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="28" height="28" />
        <h1>heatstitch</h1>
        <span class="tagline" data-i18n="app.tagline">Check and fix stitch density in DST and PES files</span>
      </div>
      <nav class="topbar-end">
        <a class="doc-link" id="doc-link" href="docs.html" data-i18n="app.docs">Guide</a>
        <select id="lang" aria-label="Language">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </nav>
    </header>

    <main class="layout" id="layout">
      <aside class="sidebar">
        <section class="panel">
          <h2 data-i18n="files.title"></h2>
          <label class="dropzone" id="dropzone">
            <input type="file" id="file-input" accept=".dst,.pes,.DST,.PES" multiple hidden />
            <span data-i18n="files.drop"></span>
          </label>
          <button type="button" id="load-example" class="link" data-i18n="files.example"></button>
          <ul id="file-list" class="file-list"></ul>
        </section>

        <section class="panel" id="material-panel">
          <h2 data-i18n="profile.title"></h2>
          <div class="profile">
            <label class="field">
              <span class="label" data-i18n="profile.fabric"></span>
              <select id="fabric"></select>
            </label>
            <label class="field">
              <span class="label" data-i18n="profile.thread"></span>
              <select id="thread"></select>
            </label>
            <p class="profile-info" id="profile-info"></p>
          </div>
          <fieldset class="checks">
            <legend data-i18n="checks.title"></legend>
            <div id="checks"></div>
          </fieldset>
          <details class="explain">
            <summary data-i18n="validation.explain"></summary>
            <ul id="explain"></ul>
          </details>
        </section>

        <section class="panel">
          <h2 data-i18n="controls.title"></h2>
          <div class="field">
            <span class="label" data-i18n="controls.metric"></span>
            <div class="segmented" role="radiogroup">
              <label><input type="radio" name="metric" value="thread" /><span data-i18n="metric.thread"></span></label>
              <label><input type="radio" name="metric" value="penetrations" /><span data-i18n="metric.penetrations"></span></label>
            </div>
          </div>
          <label class="field">
            <span class="label"><span data-i18n="controls.cell"></span> <output id="cell-out"></output></span>
            <input type="range" id="cell" min="0.5" max="5" step="0.25" />
          </label>
          <label class="field">
            <span class="label"><span data-i18n="controls.blur"></span> <output id="blur-out"></output></span>
            <input type="range" id="blur" min="0" max="3" step="0.1" />
          </label>
          <label class="field">
            <span class="label" data-i18n="controls.max"></span>
            <input type="number" id="max" min="0.1" step="0.5" />
          </label>
          <span class="unit-hint" id="unit-hint"></span>
          <label class="check"><input type="checkbox" id="include-jumps" /><span data-i18n="controls.jumps"></span></label>
          <label class="check"><input type="checkbox" id="overlay" /><span data-i18n="controls.overlay"></span></label>
          <label class="field indent">
            <span class="label"><span data-i18n="controls.opacity"></span> <output id="opacity-out"></output></span>
            <input type="range" id="opacity" min="0.05" max="1" step="0.05" />
          </label>
          <label class="check indent" data-i18n-title="controls.realistic.hint"><input type="checkbox" id="realistic" /><span data-i18n="controls.realistic"></span></label>
          <label class="field indent2" data-i18n-title="controls.threadWidth.hint">
            <span class="label"><span data-i18n="controls.threadWidth"></span> <output id="thread-width-out"></output></span>
            <input type="range" id="thread-width" min="0.02" max="1" step="0.01" />
          </label>
          <label class="check"><input type="checkbox" id="show-jumps" /><span data-i18n="controls.showJumps"></span></label>
          <div class="buttons">
            <button type="button" id="fit" data-i18n="controls.fit"></button>
            <button type="button" id="export" class="primary" data-i18n="controls.export"></button>
          </div>
        </section>

        <section class="panel">
          <h2 data-i18n="stats.title"></h2>
          <dl id="stats" class="stats"></dl>
          <div id="swatches" class="swatches"></div>
        </section>
      </aside>

      <section class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <canvas id="legend" class="legend" width="260" height="46"></canvas>
        <div id="tooltip" class="tooltip" hidden></div>
        <p class="empty" id="empty" data-i18n="canvas.empty"></p>
        <p class="hint" data-i18n="canvas.hint"></p>
        <button type="button" id="findings-open" class="findings-chip" hidden></button>
      </section>

      <aside class="inspector" id="inspector">
        <section class="panel findings" id="findings-panel">
          <div class="findings-head">
            <h2 data-i18n="findings.title"></h2>
            <label class="check val-toggle" data-i18n-title="validation.overlay.key"><input type="checkbox" id="show-validation" /><span data-i18n="validation.overlay"></span></label>
            <button type="button" id="findings-close" class="icon" data-i18n-title="findings.hide"><span aria-hidden="true">&#x2715;</span></button>
          </div>
          <div id="validation" class="findings-body" aria-live="polite"></div>
        </section>

        <section class="panel" id="correct-panel">
          <h2 data-i18n="correct.title"></h2>
          <div class="field">
            <span class="label" data-i18n="correct.goal"></span>
            <div class="segmented" role="radiogroup">
              <label><input type="radio" name="fix-goal" value="caution" /><span data-i18n="correct.goal.caution"></span></label>
              <label><input type="radio" name="fix-goal" value="critical" /><span data-i18n="correct.goal.critical"></span></label>
            </div>
          </div>
          <div class="checks fix-options">
            <label class="check"><input type="checkbox" id="fix-thin" /><span><span data-i18n="correct.thin"></span><small data-i18n="correct.thin.hint"></small></span></label>
            <label class="check"><input type="checkbox" id="fix-shorts" /><span><span data-i18n="correct.shorts"></span><small data-i18n="correct.shorts.hint"></small></span></label>
            <label class="check"><input type="checkbox" id="fix-nudge" /><span><span data-i18n="correct.nudge"></span><small data-i18n="correct.nudge.hint"></small></span></label>
          </div>
          <div class="buttons">
            <button type="button" id="fix-all" class="primary" data-i18n="correct.all"></button>
            <button type="button" id="fix-zone" data-i18n="correct.zone"></button>
          </div>
          <div id="fix-report" class="fix-report" aria-live="polite"></div>

          <h3 data-i18n="edit.title"></h3>
          <div class="buttons">
            <button type="button" id="edit-toggle" aria-pressed="false" data-i18n="edit.start"></button>
          </div>
          <div id="edit-tools" class="edit-tools" hidden>
            <p class="muted small" data-i18n="edit.hint"></p>
            <p class="sel-info" id="sel-info"></p>
            <div class="buttons">
              <button type="button" id="sel-delete" data-i18n="edit.delete"></button>
              <button type="button" id="sel-thin" data-i18n="edit.thin"></button>
              <select id="thin-share" aria-label="">
                <option value="0.25">25 %</option>
                <option value="0.34" selected>33 %</option>
                <option value="0.5">50 %</option>
              </select>
            </div>
          </div>
          <div class="buttons">
            <button type="button" id="undo" data-i18n="edit.undo" data-i18n-title="edit.undo.key"></button>
            <button type="button" id="redo" data-i18n="edit.redo" data-i18n-title="edit.redo.key"></button>
            <button type="button" id="revert" data-i18n="edit.revert"></button>
          </div>

          <h3 data-i18n="compare.title"></h3>
          <div class="buttons">
            <button type="button" id="compare-toggle" aria-pressed="false" data-i18n="compare.start"></button>
          </div>
          <table class="compare-table" id="compare-table" hidden></table>

          <h3 data-i18n="save.title"></h3>
          <div class="buttons">
            <button type="button" id="save-dst" data-i18n="save.dst"></button>
            <button type="button" id="save-pes" data-i18n="save.pes"></button>
          </div>
          <p class="muted small" data-i18n="save.note"></p>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
