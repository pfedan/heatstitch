name: CI and Pages

# The site is served from the gh-pages branch: main goes to its root, every pull request
# gets a preview under pr-preview/pr-N/ that is removed again when the PR closes.
# Other branches are checked through their pull request only: a push to them would run
# every job a second time next to the pull request's own run.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 120 objects, each common operation within a time budget (tests/load.test.ts), alone on the machine.
      - run: npx vitest run tests/load.test.ts
        env:
          LOAD: '1'
      # Switching the language in a real browser leaves no text of the old one (tests/langSwitch.test.ts);
      # the app's own tooltip on hover, focus and long press (tests/tooltip.test.ts); Space plays after a
      # button click (tests/spaceKey.test.ts); phone and tablet layout (tests/responsive.test.ts); dragging
      # an object in the list (tests/layerDrag.test.ts); a converted image opens fitted (tests/imageTakeFit.test.ts).
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run tests/langSwitch.test.ts tests/tooltip.test.ts tests/spaceKey.test.ts tests/responsive.test.ts tests/layerDrag.test.ts tests/imageTakeFit.test.ts tests/imageAssistantSwitch.test.ts
        env:
          BROWSER_TESTS: '1'
      - run: npm run build
        env:
          BASE_PATH: ${{ github.event_name == 'pull_request' && format('/heatstitch/pr-preview/pr-{0}/', github.event.number) || '' }}
      # Without it, Pages runs Jekyll over the branch and drops files starting with an underscore.
      # The one at the root covers the previews too; a copy in a preview would outlive its removal.
      - if: github.event_name != 'pull_request'
        run: touch dist/.nojekyll
      - if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true

  # Videos, voice takes and other large media live in Cloudflare R2, not in git: one file over 5 MB anywhere
  # in the history (a video, or a merge that brings back history from before the clean-up) fails here.
  size:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          big=$(git rev-list --objects HEAD | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
            | awk '$1 == "blob" && $2 > 5000000 { printf "%.1f MB  %s\n", $2 / 1e6, $3 }')
          if [ -n "$big" ]; then echo "Files over 5 MB in the history, they belong in R2:"; echo "$big"; exit 1; fi

  # Every save format read back by pystitch (Ink/Stitch's pyembroidery), an independent reader (tests/oracle.test.ts,
  # scripts/oracle.py): a writer bug that heatstitch's own reader would mirror still shows here.
  oracle:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: oracle-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install pystitch==1.0.1
      - run: npx vitest run tests/oracle.test.ts
        env:
          ORACLE: '1'
      - run: python scripts/oracle.py

  # The correction engine on its fixed test set (tests/korrekturBench.test.ts): never a new critical cell, and
  # no case fixes less than the reference in tests/bench/korrektur.json.
  korrektur:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: korrektur-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/korrekturBench.test.ts
        env:
          BENCH: '1'
          BENCH_CHECK: '1'
          BENCH_OUT: korrektur-ci.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korrektur-benchmark
          path: tests/bench/korrektur-ci.json

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      # The deploy action pushes with git, so it needs a checkout. Both it and the preview
      # action retry when the other one pushed to gh-pages in the meantime.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
      # Every deploy and every preview is a commit on gh-pages, each with a whole build, so its history
      # soon outweighs the code. Keep it one commit deep; the lease skips this when a preview pushed meanwhile.
      - name: Squash gh-pages to one commit
        run: |
          git fetch --depth=1 origin gh-pages
          head=$(git rev-parse FETCH_HEAD)
          commit=$(git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit-tree "$head^{tree}" -m "Site from ${GITHUB_SHA::7}")
          git push --force-with-lease=refs/heads/gh-pages:$head origin $commit:refs/heads/gh-pages \
            || echo "::notice::gh-pages changed meanwhile, squashed on the next deploy"

  # Fork pull requests only get a read-only token here; fork-preview.yml publishes theirs.
  preview:
    # A build cancelled by a newer run of the same PR leaves no site to publish; on close there is no build.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      !cancelled() && (needs.build.result == 'success' || github.event.action == 'closed')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The action pushes with git, so it needs a checkout too.
      - uses: actions/checkout@v4
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
