name: CI and Pages

# Two addresses, both served by Cloudflare (wrangler.jsonc): develop goes to https://beta.heatstitch.app
# on every merge (deploy-beta below), and https://heatstitch.app only gets a published release
# (release.yml). Every pull request gets a preview of its own at https://pr-N-heatstitch.<account>.workers.dev.
# A push to main runs the checks only: main follows the releases (a hotfix is merged there, see CONTRIBUTING).
# Other branches are checked through their pull request only: a push to them would run every job a
# second time next to the pull request's own run.
# A newer push to a pull request cancels its older checks; a push to develop or main never cancels
# another commit's checks (each commit has its own group), since a release waits for exactly those.

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A pull request into another branch (a stage collected in a feature branch, see docs/rust-core.md) only
  # gets the build, the unit tests and the core's checks; the slow jobs and the preview run when that
  # branch comes to develop.
  # The tests run on several machines side by side, the site is built next to them: the run takes as long
  # as its slowest job instead of all of them one after another. Deploy and preview wait for all of them.
  # The compute core is built to WebAssembly once (wasm) and handed to every job that runs the app.
  wasm:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: wasm-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      # The same core gives the same module: a run that changed nothing in core/ takes it from the last one.
      - id: pkg
        uses: actions/cache@v4
        with:
          path: src/wasm/pkg
          key: wasm-pkg-${{ hashFiles('core/**', 'package.json', 'rust-toolchain.toml', '.github/actions/core/action.yml') }}
      - if: steps.pkg.outputs.cache-hit != 'true'
        uses: ./.github/actions/core
      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: src/wasm/pkg
          if-no-files-found: error
      # Kept in R2 per state of the core as well, for cloud sessions to take instead of compiling it
      # (scripts/coreCache.mjs). Skipped where the R2 secrets are missing, as on a fork's pull request.
      # A failed upload only costs the sessions a build, it does not stop the run.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: node scripts/coreCache.mjs upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  build:
    if: github.event.action != 'closed'
    needs: wasm
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: true
    steps:
      # The whole history with its tags: the build shows the last release and the commits since (src/build/version.ts).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          CHANNEL: ${{ github.event_name == 'pull_request' && 'preview' || github.ref == 'refs/heads/develop' && 'beta' || 'dev' }}
      - if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true

  # All test files, a third on each machine (vitest --shard: every file runs on exactly one of them), split
  # by how long each file runs (tests/sequencer.ts, tests/timings.json) so the machines finish together.
  test:
    if: github.event.action != 'closed'
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    concurrency:
      group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # The Rust compute core on its own (core/): formatting, lints and its unit tests, natively.
  core:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: core-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
        working-directory: core

  # 120 objects, each common operation within a time budget (tests/load.test.ts), alone on the machine.
  load:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main')
    needs: wasm
    runs-on: ubuntu-latest
    concurrency:
      group: load-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx vitest run tests/load.test.ts
        env:
          LOAD: '1'

  # Switching the language in a real browser leaves no text of the old one (tests/langSwitch.test.ts);
  # the app's own tooltip on hover, focus and long press (tests/tooltip.test.ts); Space plays after a
  # button click (tests/spaceKey.test.ts); phone and tablet layout (tests/responsive.test.ts); dragging
  # an object in the list (tests/layerDrag.test.ts); a converted image opens fitted (tests/imageTakeFit.test.ts);
  # opening a section of the right column, scrolled down, does not make it jump (tests/sectionScroll.test.ts).
  browser:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main')
    needs: wasm
    runs-on: ubuntu-latest
    concurrency:
      group: browser-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The browser is kept per Playwright version; the system libraries it needs are installed every time.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx vitest run tests/langSwitch.test.ts tests/tooltip.test.ts tests/spaceKey.test.ts tests/responsive.test.ts tests/layerDrag.test.ts tests/imageTakeFit.test.ts tests/imageAssistantSwitch.test.ts tests/sectionScroll.test.ts tests/panelScroll.test.ts tests/newLetteringDragBrowser.test.ts
        env:
          BROWSER_TESTS: '1'

  # Videos, voice takes and other large media live in Cloudflare R2, not in git: one file over 5 MB anywhere
  # in the history (a video, or a merge that brings back history from before the clean-up) fails here.
  size:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          big=$(git rev-list --objects HEAD | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
            | awk '$1 == "blob" && $2 > 5000000 { printf "%.1f MB  %s\n", $2 / 1e6, $3 }')
          if [ -n "$big" ]; then echo "Files over 5 MB in the history, they belong in R2:"; echo "$big"; exit 1; fi

  # Every save format read back by pystitch (Ink/Stitch's pyembroidery), an independent reader (tests/oracle.test.ts,
  # scripts/oracle.py): a writer bug that heatstitch's own reader would mirror still shows here.
  oracle:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main')
    needs: wasm
    runs-on: ubuntu-latest
    concurrency:
      group: oracle-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pystitch==1.0.1
      - run: npx vitest run tests/oracle.test.ts
        env:
          ORACLE: '1'
      - run: python scripts/oracle.py

  # The correction engine on its fixed test set (tests/korrekturBench.test.ts): never a new critical cell, and
  # no case fixes less than the reference in tests/bench/korrektur.json. A third of the cases on each machine
  # (BENCH_SHARD, split by the reference's times); each case gives the same result as in one run.
  korrektur:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main')
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    concurrency:
      group: korrektur-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx vitest run tests/korrekturBench.test.ts
        env:
          BENCH: '1'
          BENCH_CHECK: '1'
          BENCH_SHARD: ${{ matrix.shard }}/3
          BENCH_OUT: korrektur-ci-${{ matrix.shard }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korrektur-benchmark-${{ matrix.shard }}
          path: tests/bench/korrektur-ci-${{ matrix.shard }}.json

  # Every merge into develop: the beta at https://beta.heatstitch.app, a Worker of its own (wrangler.jsonc, env beta)
  # with its own address and so its own storage, apart from heatstitch.app.
  deploy-beta:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: [build, test, load, browser, core]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-beta
      cancel-in-progress: false
    steps:
      # wrangler.jsonc and cloudflare/worker.js come from the checkout, the site from the build.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wrangler@4.149.0 deploy --env beta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Fork pull requests get no secrets here; fork-preview.yml uploads theirs.
  preview:
    # A run cancelled by a newer one of the same PR leaves no site to publish.
    # Published only when the tests passed too.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && !cancelled() &&
      needs.build.result == 'success' && needs.test.result == 'success' &&
      needs.load.result == 'success' && needs.browser.result == 'success'
    needs: [build, test, load, browser, core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      # A version of the Worker that never reaches heatstitch.app, under an alias that stays the same for
      # the whole PR. Before the Worker's first deploy (or without the Cloudflare secrets) there is none to
      # add a version to: the PR then just has no preview, its checks stay green.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: upload
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.number }}
        run: |
          npx --yes wrangler@4.149.0 versions upload --preview-alias "pr-$PR" --message "PR $PR" | tee upload.log
          echo "url=$(grep -o 'Preview Alias URL: https://[^ ]*' upload.log | cut -d' ' -f4)" >> "$GITHUB_OUTPUT"
      - if: steps.upload.outputs.url
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          message: |
            :rocket: Preview: ${{ steps.upload.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }}. It has an address of its own, so nothing in it touches what is stored on heatstitch.app.

  # A closed pull request's preview address keeps working (an alias can't be deleted), so it gets a
  # short page instead that leads to heatstitch.app: an old link never shows an outdated app.
  preview-closed:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: upload
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.number }}
        run: npx --yes wrangler@4.149.0 versions upload --assets cloudflare/closed --preview-alias "pr-$PR" --message "PR $PR closed"
      - if: steps.upload.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          message: |
            The preview is retired: its address now shows a short note that leads to heatstitch.app.
