name: CI and Pages

# The site is served by Cloudflare at https://heatstitch.app (wrangler.jsonc): main goes there, every
# pull request gets a preview of its own at https://pr-N-heatstitch.<account>.workers.dev. The old
# address pfedan.github.io/heatstitch/ (the gh-pages branch) keeps a moving page (tools/moved/).
# Other branches are checked through their pull request only: a push to them would run
# every job a second time next to the pull request's own run.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tests run on several machines side by side, the site is built next to them: the run takes as long
  # as its slowest job instead of all of them one after another. Deploy and preview wait for all of them.
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true

  # All test files, a third on each machine (vitest --shard: every file runs on exactly one of them).
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    concurrency:
      group: test-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # 120 objects, each common operation within a time budget (tests/load.test.ts), alone on the machine.
  load:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: load-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/load.test.ts
        env:
          LOAD: '1'

  # Switching the language in a real browser leaves no text of the old one (tests/langSwitch.test.ts);
  # the app's own tooltip on hover, focus and long press (tests/tooltip.test.ts); Space plays after a
  # button click (tests/spaceKey.test.ts); phone and tablet layout (tests/responsive.test.ts); dragging
  # an object in the list (tests/layerDrag.test.ts); a converted image opens fitted (tests/imageTakeFit.test.ts);
  # opening a section of the right column, scrolled down, does not make it jump (tests/sectionScroll.test.ts).
  browser:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: browser-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser is kept per Playwright version; the system libraries it needs are installed every time.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx vitest run tests/langSwitch.test.ts tests/tooltip.test.ts tests/spaceKey.test.ts tests/responsive.test.ts tests/layerDrag.test.ts tests/imageTakeFit.test.ts tests/imageAssistantSwitch.test.ts tests/sectionScroll.test.ts tests/panelScroll.test.ts
        env:
          BROWSER_TESTS: '1'

  # Videos, voice takes and other large media live in Cloudflare R2, not in git: one file over 5 MB anywhere
  # in the history (a video, or a merge that brings back history from before the clean-up) fails here.
  size:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          big=$(git rev-list --objects HEAD | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
            | awk '$1 == "blob" && $2 > 5000000 { printf "%.1f MB  %s\n", $2 / 1e6, $3 }')
          if [ -n "$big" ]; then echo "Files over 5 MB in the history, they belong in R2:"; echo "$big"; exit 1; fi

  # Every save format read back by pystitch (Ink/Stitch's pyembroidery), an independent reader (tests/oracle.test.ts,
  # scripts/oracle.py): a writer bug that heatstitch's own reader would mirror still shows here.
  oracle:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: oracle-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install pystitch==1.0.1
      - run: npx vitest run tests/oracle.test.ts
        env:
          ORACLE: '1'
      - run: python scripts/oracle.py

  # The correction engine on its fixed test set (tests/korrekturBench.test.ts): never a new critical cell, and
  # no case fixes less than the reference in tests/bench/korrektur.json.
  korrektur:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: korrektur-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/korrekturBench.test.ts
        env:
          BENCH: '1'
          BENCH_CHECK: '1'
          BENCH_OUT: korrektur-ci.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korrektur-benchmark
          path: tests/bench/korrektur-ci.json

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, test, load, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      # wrangler.jsonc and cloudflare/worker.js come from the checkout, the site from the build.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wrangler@4.149.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Only once heatstitch.app is up: the old address becomes the moving page (tools/moved/), which takes
      # stored designs along and sends every old link to the same page there. Rewritten whole each time.
      - run: node tools/moved/build.mjs dist-moved
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist-moved
          branch: gh-pages
          clean: true
          single-commit: true

  # Fork pull requests get no secrets here; fork-preview.yml uploads theirs.
  preview:
    # A run cancelled by a newer one of the same PR leaves no site to publish.
    # Published only when the tests passed too.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && !cancelled() &&
      needs.build.result == 'success' && needs.test.result == 'success' &&
      needs.load.result == 'success' && needs.browser.result == 'success'
    needs: [build, test, load, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      # A version of the Worker that never reaches heatstitch.app, under an alias that stays the same for
      # the whole PR. Before the Worker's first deploy (or without the Cloudflare secrets) there is none to
      # add a version to: the PR then just has no preview, its checks stay green.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: upload
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.number }}
        run: |
          npx --yes wrangler@4.149.0 versions upload --preview-alias "pr-$PR" --message "PR $PR" | tee upload.log
          echo "url=$(grep -o 'Preview Alias URL: https://[^ ]*' upload.log | cut -d' ' -f4)" >> "$GITHUB_OUTPUT"
      - if: steps.upload.outputs.url
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          message: |
            :rocket: Preview: ${{ steps.upload.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }}. It has an address of its own, so nothing in it touches what is stored on heatstitch.app.

  # A closed pull request's preview address keeps working (an alias can't be deleted), so it gets a
  # short page instead that leads to heatstitch.app: an old link never shows an outdated app.
  preview-closed:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: upload
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.number }}
        run: npx --yes wrangler@4.149.0 versions upload --assets cloudflare/closed --preview-alias "pr-$PR" --message "PR $PR closed"
      - if: steps.upload.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          message: |
            The preview is retired: its address now shows a short note that leads to heatstitch.app.
