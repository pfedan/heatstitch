name: Fork previews

# Pull requests from forks get no secrets, so "CI and Pages" can build them but not upload the
# preview. This workflow does that part with this repository's secrets, once the fork's run has
# been approved and its build passed. It never runs code from the fork: it uploads the built site
# with our own wrangler.jsonc and cloudflare/worker.js as a preview version at
# https://pr-N-heatstitch.<account>.workers.dev, an address of its own that never reaches heatstitch.app.

on:
  workflow_run:
    workflows: [CI and Pages]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fork-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # GitHub does not link fork runs to their pull request, so look it up by the fork's
      # branch and only go on while that pull request is open and still at the built commit.
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$HEAD" \
            --jq "map(select(.head.sha == \"$SHA\")) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Pull request: ${number:-none open at $SHA}"
      # Our own main branch: the Worker and its configuration never come from the fork.
      - if: steps.pr.outputs.number
        uses: actions/checkout@v4
      - if: steps.pr.outputs.number
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: steps.pr.outputs.number
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.pr.outputs.number
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          npx --yes wrangler@4.149.0 versions upload --preview-alias "pr-$PR" --message "PR $PR (fork)" | tee upload.log
          echo "url=$(grep -o 'Preview Alias URL: https://[^ ]*' upload.log | cut -d' ' -f4)" >> "$GITHUB_OUTPUT"
      - if: steps.upload.outputs.url
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            :rocket: Preview: ${{ steps.upload.outputs.url }}

            Built from ${{ github.event.workflow_run.head_sha }}. It has an address of its own, so nothing in it touches what is stored on heatstitch.app.
