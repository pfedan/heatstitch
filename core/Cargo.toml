[package]
name = "heatstitch-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The compute core of heatstitch: stitches, shapes, checks and file formats, for the browser as WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
clipper2-rust = "1.2.0"
kurbo = "0.13.1"
linesweeper = "0.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Smaller at no cost in speed: no names section, and no unwinding (wasm32 cannot unwind anyway).
panic = "abort"
strip = true

# For working on the code (dev, test, typecheck; see scripts/wasm.mjs): just as fast to run, but
# rebuilt in seconds instead of minutes, as it skips the whole-program optimisation.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# wasm-opt (binaryen) is not needed: LTO already gives a small module, and leaving it out keeps
# the build free of a second downloaded tool.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.custom]
wasm-opt = false
